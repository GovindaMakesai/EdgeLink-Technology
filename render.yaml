# Render Blueprint for the BullMQ worker only.
# The Next.js app stays on Vercel. Do not add a web service here.
services:
  - type: worker
    name: edgelink-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCKS
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: SUPABASE_STORAGE_BUCKET
        value: audit-reports
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
